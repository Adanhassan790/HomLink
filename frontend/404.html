<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="images/logo.jfif">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - HomLink</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        body { background: #f4f6f9; }

        .notfound-page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .notfound-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.07);
            padding: 56px 48px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .notfound-code {
            font-size: 100px;
            font-weight: 900;
            color: #e5e7eb;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -4px;
        }

        .notfound-house {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .notfound-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1A2B4A;
            margin: 0 0 12px;
        }

        .notfound-card p {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .notfound-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nf-btn {
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity .15s, transform .15s;
        }
        .nf-btn:hover { opacity: .9; transform: translateY(-1px); }
        .nf-btn-primary { background: #1B7F4F; color: #fff; }
        .nf-btn-outline { background: transparent; color: #1A2B4A; border: 2px solid #d1d5db; }

        .notfound-links {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #f0f2f5;
            font-size: 13px;
            color: #9ca3af;
        }

        .notfound-links a {
            color: #1B7F4F;
            text-decoration: none;
            font-weight: 600;
        }
        .notfound-links a:hover { text-decoration: underline; }
        .notfound-links span { margin: 0 8px; }

        @media (max-width: 480px) {
            .notfound-card { padding: 40px 24px; }
            .notfound-code { font-size: 72px; }
            .notfound-actions { flex-direction: column; }
            .nf-btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <div class="notfound-page">
        <div class="notfound-card">
            <div class="notfound-code">404</div>
            <div class="notfound-house">🏠</div>
            <h1>Page Not Found</h1>
            <p>
                Looks like this room has been taken — or never existed.<br>
                The page you're looking for isn't here.
            </p>
            <div class="notfound-actions">
                <a href="index.html" class="nf-btn nf-btn-primary">Go to Homepage</a>
                <a href="search.html" class="nf-btn nf-btn-outline">Browse Rooms</a>
            </div>
            <div class="notfound-links">
                <a href="login.html">Login</a>
                <span>·</span>
                <a href="register.html">Register</a>
                <span>·</span>
                <a href="https://wa.me/254757734299" target="_blank" rel="noopener">Contact Support</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { renderNavbar } from './js/utils.js';
        import { getCurrentUser } from './js/auth.js';
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar(getCurrentUser());
        });
    </script>
</body>
</html>
