<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="images/logo.jfif">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Accommodation in Kilifi – HomLink</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        /* ── Layout ── */
        .sp-wrap {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            min-height: calc(100vh - 64px);
            background: #f4f6f9;
        }

        /* ── Sidebar ── */
        .sp-sidebar {
            background: #fff;
            border-right: 1px solid #e5e8ed;
            padding: 24px 20px 40px;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .sp-sidebar::-webkit-scrollbar { width: 4px; }
        .sp-sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        .sp-sidebar-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #9ca3af;
            margin: 0 0 16px;
        }

        .sf-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f2f5;
        }
        .sf-group:last-of-type { border-bottom: none; }

        .sf-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #374151;
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sf-label svg {
            width: 13px; height: 13px;
            stroke: #1B7F4F; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        /* select */
        .sf-select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            background: #f9fafb;
            outline: none;
            cursor: pointer;
            transition: border .15s;
        }
        .sf-select:focus { border-color: #1B7F4F; background: #fff; }

        /* checkboxes */
        .sf-checks { display: flex; flex-direction: column; gap: 6px; }
        .sf-check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            padding: 3px 0;
        }
        .sf-check-label input[type="checkbox"] {
            width: 15px; height: 15px;
            accent-color: #1B7F4F;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* price row */
        .sf-price-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 6px;
        }
        .sf-price-input {
            padding: 9px 10px;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            background: #f9fafb;
            width: 100%;
            outline: none;
            transition: border .15s;
        }
        .sf-price-input:focus { border-color: #1B7F4F; background: #fff; }
        .sf-price-sep { font-size: 13px; color: #9ca3af; }

        /* distance slider */
        .sf-slider { width: 100%; accent-color: #1B7F4F; cursor: pointer; }
        .sf-slider-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #9ca3af; margin-top: 4px;
        }
        .sf-dist-badge {
            display: inline-block;
            background: #eefbf4;
            color: #1B7F4F;
            font-size: 12px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 6px;
        }

        /* sidebar buttons */
        .sf-btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .sf-apply {
            flex: 1;
            padding: 10px;
            background: #1B7F4F;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
        }
        .sf-apply:hover { background: #166c42; }
        .sf-clear {
            padding: 10px 14px;
            background: #f4f6f9;
            color: #6b7280;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background .15s;
        }
        .sf-clear:hover { background: #e9ecf0; }

        /* mobile filter toggle */
        .sp-mob-filter-toggle {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #1A2B4A;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            width: fit-content;
        }
        .sp-mob-filter-toggle svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; }

        /* ── Main content ── */
        .sp-main { padding: 24px; display: flex; flex-direction: column; gap: 20px; }

        /* toolbar */
        .sp-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .sp-count {
            font-size: 14px;
            color: #6b7280;
        }
        .sp-count strong { color: #1A2B4A; font-size: 16px; }

        .sp-sort {
            padding: 9px 14px;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            background: #fff;
            cursor: pointer;
            outline: none;
            transition: border .15s;
        }
        .sp-sort:focus { border-color: #1B7F4F; }

        /* active filters chips */
        .sp-active-filters { display: flex; flex-wrap: wrap; gap: 6px; }
        .sp-filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #eefbf4;
            color: #1B7F4F;
            border: 1px solid #b7e8d0;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .sp-filter-chip button {
            background: none; border: none; cursor: pointer;
            color: #1B7F4F; font-size: 14px; line-height: 1; padding: 0;
        }

        /* grid */
        .sp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        /* ── Property Card ── */
        .pc {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e9ecf0;
            cursor: pointer;
            transition: transform .18s, box-shadow .18s;
            display: flex;
            flex-direction: column;
        }
        .pc:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(26,43,74,.12); }
        .pc:focus-visible { outline: 2px solid #1B7F4F; outline-offset: 2px; }

        .pc-img-wrap {
            position: relative;
            height: 170px;
            background: #e9ecf0;
            overflow: hidden;
            flex-shrink: 0;
        }
        .pc-img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s;
        }
        .pc:hover .pc-img-wrap img { transform: scale(1.04); }
        .pc-no-img {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 6px; color: #9ca3af;
        }
        .pc-no-img svg { width: 32px; height: 32px; stroke: #d1d5db; fill: none; stroke-width: 1.5; }
        .pc-no-img span { font-size: 12px; }

        .pc-badges {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-wrap: wrap; gap: 4px;
        }
        .pc-badge {
            font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
            letter-spacing: .02em;
        }
        .pc-badge-featured { background: #fef3c7; color: #92400e; }
        .pc-badge-verified { background: #d1fae5; color: #065f46; }
        .pc-badge-campus  { background: #dbeafe; color: #1e40af; }

        .pc-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

        .pc-type {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: #1B7F4F;
        }
        .pc-title {
            font-size: 14px; font-weight: 700; color: #1A2B4A;
            line-height: 1.3; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .pc-loc {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; color: #6b7280;
        }
        .pc-loc svg { width: 12px; height: 12px; stroke: #9ca3af; fill: none; stroke-width: 2; flex-shrink: 0; }

        .pc-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: auto; padding-top: 10px;
            border-top: 1px solid #f0f2f5;
        }
        .pc-price { font-size: 16px; font-weight: 800; color: #1A2B4A; }
        .pc-price span { font-size: 11px; font-weight: 500; color: #9ca3af; }
        .pc-cta {
            font-size: 12px; font-weight: 700; color: #1B7F4F;
            display: flex; align-items: center; gap: 3px;
        }
        .pc-cta svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        /* ── Skeleton loader ── */
        .pc-skel {
            background: #fff; border-radius: 12px; overflow: hidden;
            border: 1px solid #e9ecf0;
        }
        .skel-img  { height: 170px; background: #f0f2f5; }
        .skel-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
        .skel-line {
            height: 12px; border-radius: 6px;
            background: linear-gradient(90deg, #f0f2f5 25%, #e5e8ed 50%, #f0f2f5 75%);
            background-size: 200% 100%;
            animation: skel-shimmer 1.4s infinite;
        }
        @keyframes skel-shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Empty / Error state ── */
        .sp-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 24px;
        }
        .sp-empty-icon {
            width: 64px; height: 64px; margin: 0 auto 16px;
            background: #f4f6f9; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .sp-empty-icon svg { width: 28px; height: 28px; stroke: #9ca3af; fill: none; stroke-width: 1.5; }
        .sp-empty h4 { font-size: 16px; color: #374151; margin: 0 0 6px; }
        .sp-empty p  { font-size: 13px; color: #9ca3af; margin: 0 0 16px; }
        .sp-empty-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 600; color: #1B7F4F;
            text-decoration: none;
        }
        .sp-empty-link:hover { text-decoration: underline; }

        /* ── Pagination ── */
        .sp-pagination {
            display: flex; justify-content: center; align-items: center; gap: 4px;
            padding-bottom: 40px;
        }
        .sp-pg-btn {
            min-width: 36px; height: 36px; padding: 0 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #e5e8ed; border-radius: 8px;
            background: #fff; color: #374151;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all .15s;
        }
        .sp-pg-btn:hover:not(:disabled) { border-color: #1B7F4F; color: #1B7F4F; }
        .sp-pg-btn.active { background: #1B7F4F; color: #fff; border-color: #1B7F4F; }
        .sp-pg-btn:disabled { opacity: .4; cursor: not-allowed; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .sp-wrap { grid-template-columns: 1fr; }
            .sp-sidebar {
                position: static; height: auto;
                border-right: none; border-bottom: 1px solid #e5e8ed;
                display: none;
            }
            .sp-sidebar.open { display: flex; }
            .sp-mob-filter-toggle { display: flex; }
        }
        @media (max-width: 560px) {
            .sp-main { padding: 16px; }
            .sp-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 375px) {
            .sp-main          { padding: 10px; }
            .sp-grid          { gap: 10px; }
            .sp-toolbar       { flex-direction: column; align-items: flex-start; gap: 8px; }
            .sp-sort          { width: 100%; }
            .pc-img-wrap      { height: 150px !important; }
            .sp-sidebar       { width: 100%; max-width: 100vw; }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <div class="sp-wrap">
        <!-- ── Sidebar filters ── -->
        <aside id="sp-sidebar" class="sp-sidebar">
            <p class="sp-sidebar-title">Filter Results</p>

            <!-- Area -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    Area in Kilifi
                </p>
                <select id="sf-area" class="sf-select">
                    <option value="">All Areas</option>
                </select>
            </div>

            <!-- Property type -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Property Type
                </p>
                <select id="sf-type" class="sf-select">
                    <option value="">Any Type</option>
                    <option value="single_room">Single Room</option>
                    <option value="bedsitter">Bedsitter</option>
                    <option value="studio">Studio</option>
                    <option value="1br">1 Bedroom</option>
                    <option value="2br">2 Bedroom</option>
                    <option value="3br">3 Bedroom</option>
                    <option value="maisonette">Maisonette</option>
                </select>
            </div>

            <!-- Monthly rent -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Monthly Rent (KES)
                </p>
                <div class="sf-price-row">
                    <input type="number" id="sf-min" class="sf-price-input" placeholder="Min" min="0">
                    <span class="sf-price-sep">–</span>
                    <input type="number" id="sf-max" class="sf-price-input" placeholder="Max" min="0">
                </div>
            </div>

            <!-- Distance -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Distance from Campus
                    <span class="sf-dist-badge" id="sf-dist-val">5 km</span>
                </p>
                <input type="range" id="sf-dist" class="sf-slider" min="0" max="5" step="0.5" value="5">
                <div class="sf-slider-labels"><span>On campus</span><span>5 km</span></div>
            </div>

            <!-- Amenities -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    Amenities
                </p>
                <div class="sf-checks" id="sf-amenities">
                    <span style="font-size:12px;color:#9ca3af;">Loading…</span>
                </div>
            </div>

            <!-- Student needs -->
            <div class="sf-group">
                <p class="sf-label">
                    <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                    Student Needs
                </p>
                <div class="sf-checks">
                    <label class="sf-check-label"><input type="checkbox" id="sf-furnished"> Furnished</label>
                    <label class="sf-check-label"><input type="checkbox" id="sf-wifi"> WiFi Available</label>
                    <label class="sf-check-label"><input type="checkbox" id="sf-security"> 24/7 Security</label>
                    <label class="sf-check-label"><input type="checkbox" id="sf-near-campus"> Near Campus (&lt;1 km)</label>
                </div>
            </div>

            <div class="sf-btn-row">
                <button class="sf-apply" id="sf-apply">Apply Filters</button>
                <button class="sf-clear" id="sf-clear">Clear</button>
            </div>
        </aside>

        <!-- ── Main results ── -->
        <main class="sp-main">

            <!-- Mobile toggle -->
            <button class="sp-mob-filter-toggle" id="sp-mob-toggle">
                <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
                Filters
            </button>

            <!-- Toolbar -->
            <div class="sp-toolbar">
                <div class="sp-count">Showing <strong id="sp-count">…</strong> properties</div>
                <select id="sp-sort" class="sp-sort">
                    <option value="-created_at">Newest First</option>
                    <option value="rent_amount">Price: Low to High</option>
                    <option value="-rent_amount">Price: High to Low</option>
                    <option value="-views_count">Most Viewed</option>
                </select>
            </div>

            <!-- Active filter chips -->
            <div class="sp-active-filters" id="sp-chips" style="display:none"></div>

            <!-- Cards grid -->
            <div class="sp-grid" id="sp-grid"></div>

            <!-- Pagination -->
            <div class="sp-pagination" id="sp-pagination"></div>
        </main>
    </div>

    <script type="module" src="js/search.js"></script>
</body>
</html>
